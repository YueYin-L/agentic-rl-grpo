[project]
name = "research-router-opt"
version = "0.1.0"
description = "CPU-only Agentic RL prototype for reward-driven research tool routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4.0,<2",
    "fastapi>=0.115.0",
    "pandas>=2.2.0,<3",
    "pydantic>=2.10.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[project.scripts]
research-router = "research_router_opt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_router_opt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/research_router_opt"]
